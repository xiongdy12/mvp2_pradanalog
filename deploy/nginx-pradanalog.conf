# PradanaLog — reverse proxy Nginx
# =================================================================
# Simpan sebagai /etc/nginx/sites-available/pradanalog lalu:
#   sudo ln -s /etc/nginx/sites-available/pradanalog /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ganti pradanalog.del.ac.id dengan domain yang disediakan tim TI.
# Sertifikat HTTPS dipasang belakangan dengan:
#   sudo certbot --nginx -d pradanalog.del.ac.id
# Certbot akan menambahkan sendiri blok listen 443 dan baris ssl_*.

server {
    listen 80;
    listen [::]:80;
    server_name pradanalog.del.ac.id;

    # Unggahan dan unduhan laporan; Streamlit sendiri membatasi 200 MB.
    client_max_body_size 200M;

    # Halaman dasbor bisa lama memproses MOLP; jangan diputus terlalu cepat.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # Streamlit memakai WebSocket untuk memperbarui halaman. Tanpa dua
        # baris berikut, dasbor akan tampil lalu membeku pada "Connecting...".
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }

    # Endpoint kesehatan; berguna untuk pemantauan tim TI.
    location /_stcore/health {
        proxy_pass http://127.0.0.1:8501/_stcore/health;
        access_log off;
    }
}
