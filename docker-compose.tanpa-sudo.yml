# PradanaLog — susunan untuk pengguna TANPA hak sudo
# =================================================================
# Dipakai bila Bapak hanya anggota grup docker, tanpa hak sudo:
# Nginx dan sertifikat HTTPS ikut dijalankan sebagai container,
# bukan dipasang ke sistem.
#
#   docker compose -f docker-compose.tanpa-sudo.yml up -d --build
#
# Caddy mengurus sertifikat HTTPS sendiri, tanpa certbot dan tanpa
# sudo. Syaratnya dua, dan keduanya tetap urusan tim TI:
#   1. Subdomain sudah diarahkan ke IP server ini
#   2. Port 80 dan 443 terbuka dari internet
#
# Daemon Docker berjalan sebagai root, sehingga container BOLEH
# memakai port 80/443 walau Bapak sendiri tidak punya sudo.

services:
  pradanalog:
    build: .
    image: pradanalog:latest
    container_name: pradanalog
    restart: unless-stopped
    # Berjalan sebagai pemilik berkas di host, bukan sebagai uid 10001
    # bawaan citra. Tanpa ini, kredensial.json yang berizin 600 tidak
    # terbaca dari dalam container dan setiap tab melempar
    # PermissionError. Angkanya dibaca dari berkas .env; buat dengan:
    #   printf 'HOST_UID=%s\nHOST_GID=%s\n' $(id -u) $(id -g) > .env
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # Tidak ada "ports" di sini: dasbor hanya dijangkau Caddy lewat
    # jaringan internal Docker, tidak terbuka langsung ke internet.
    expose:
      - "8501"
    volumes:
      - ./kredensial.json:/app/kredensial.json:ro
    environment:
      TZ: Asia/Jakarta
      # uid dari host tidak punya direktori rumah di dalam container.
      HOME: /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: pradanalog-caddy
    restart: unless-stopped
    depends_on:
      - pradanalog
    # Alamat yang boleh menjangkau Caddy dari luar container, diatur
    # lewat BIND_ADDR di berkas .env:
    #   BIND_ADDR=0.0.0.0     seluruh jaringan (dipakai bila TIDAK memakai
    #                         terowongan, misalnya lewat NAT kampus)
    #   BIND_ADDR=127.0.0.1   hanya dari dalam server (dipakai bila akses
    #                         publik lewat Cloudflare Tunnel; container
    #                         cloudflared tetap menjangkau caddy lewat
    #                         jaringan internal Docker, bukan lewat port ini)
    ports:
      - "${BIND_ADDR:-0.0.0.0}:80:80"
      - "${BIND_ADDR:-0.0.0.0}:443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # sertifikat HTTPS disimpan di sini
      - caddy_config:/config
    environment:
      TZ: Asia/Jakarta

volumes:
  caddy_data:
  caddy_config:
